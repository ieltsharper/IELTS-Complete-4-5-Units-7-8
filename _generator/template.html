<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>@@TITLE@@ · IELTS Harper Portal</title>
<!-- Made from the teacher's file IELTS_Units_7-8_Review_Exercises_Progress_Test.html (2026-11-23).
     Book extracts: Complete IELTS Bands 4-5 (Cambridge University Press, 2012). Look = IELTS Harper Portal. -->
<style>
:root{
  --page:#f7f5f2; --card:#ffffff; --line:#e7e5e4; --line-strong:#d6d3d1;
  --ink:#1c1917; --muted:#57534e; --heading:#f96c1b;
  --brand:#c2410c; --brand-hover:#9a3412; --on-brand:#ffffff; --brand-soft:#fff7ed;
  --ok:#065f46; --ok-soft:#ecfdf5; --no:#991b1b; --no-soft:#fef2f2;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#171311; --card:#221c19; --line:#3a302b; --line-strong:#4f433c;
    --ink:#f5f0eb; --muted:#b8aca3; --brand-soft:#3a2416;
    --ok:#6ee7b7; --ok-soft:#12302a; --no:#fca5a5; --no-soft:#3b1d1d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--heading);font-weight:700;font-size:1.15rem;text-decoration:none;margin-right:auto}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:.85rem;font-weight:800}
.topbar-link{color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:26px 0 14px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;margin:0 0 10px}
h1{color:var(--heading);font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.2;margin:0 0 6px}
.sub{margin:0;color:var(--muted)}
/* tabs */
.tabs{background:var(--page);padding:8px 0 10px;margin-bottom:6px}
@media (min-width:760px) and (min-height:720px){.tabs{position:sticky;top:0;z-index:5}}
.tabgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.tabgroup .glabel{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:100%}
.tab{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tab.done::after{content:" \2713";font-weight:800}
/* section + blocks */
.sec{display:none}
.sec.on{display:block}
.sec-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.sec-head h2{color:var(--heading);font-size:1.3rem;margin:0 0 2px}
.src{color:var(--muted);font-size:.88rem;margin:0}
.sec-score{margin-top:8px;font-weight:700;color:var(--brand)}
.note{background:var(--brand-soft);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 14px;margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.blk h3{font-size:1.04rem;margin:0 0 10px}
.grp{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin:18px 2px 8px}
.blk ol,.blk ul{margin:6px 0 10px;padding-left:28px}
.blk li{margin:6px 0}
ol.ab{list-style:lower-alpha}
.box{display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--page);margin:8px 0 12px}
.box .w{border:1px solid var(--brand);background:var(--card);border-radius:999px;padding:2px 12px;font-weight:600;font-size:.93rem}
.text{border-left:4px solid var(--brand);background:var(--page);border-radius:0 10px 10px 0;padding:10px 14px;margin:8px 0 12px;line-height:2.1}
.text p{margin:6px 0;line-height:2.1}
.card{background:var(--brand-soft);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:0 0 12px}
.card p{margin:3px 0}
.card ul{margin:4px 0}
.graph{border:1px solid var(--line);background:var(--page);border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:.92rem;color:var(--muted)}
.eg{color:var(--brand);font-weight:700;border-bottom:2px solid var(--brand);padding:0 3px}
.g{display:inline-block;min-width:80px;border-bottom:2px solid var(--line-strong);height:1em;vertical-align:baseline;margin:0 3px}
/* controls */
.gap{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:3px 9px;margin:0 3px;line-height:1.5;max-width:100%}
input.gap{width:8.5em}
input.gap.w2{width:12em}
input.gap.w3{width:15em}
select.gap{min-width:7.5em}
input.gap.wide{width:min(100%,24em)}
textarea.free{display:block;width:100%;min-height:62px;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:7px 10px;margin:6px 0 2px}
.gap.right,textarea.free.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.gap.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.fix{font-size:.85rem;color:var(--ok);font-weight:700;margin-left:4px}
.sugg{margin:4px 0 6px;padding:7px 12px;border-radius:10px;background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);font-size:.93rem}
.sugg[hidden]{display:none}
.opts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 2px}
.opt{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:3px 14px;cursor:pointer;font-weight:600}
.opt b{color:var(--brand);margin-right:4px}
.opt[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.opt[aria-pressed="true"] b{color:var(--on-brand)}
.opt.locked{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.right b{color:var(--ok)}
.opt.wrong{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.opt.wrong b{color:var(--no)}
.opt.answer{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.terms li{margin:8px 0}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.blk-score{margin-left:auto;font-weight:800;color:var(--brand)}
footer{color:var(--muted);font-size:.85rem;padding:18px 0 40px;border-top:1px solid var(--line);margin-top:10px}
/* compulsory test */
.who{margin:0 0 12px;font-size:.92rem;color:var(--muted)}
.who strong{color:var(--ink)}
.link-btn{border:0;background:none;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;cursor:pointer}
.result{background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:18px 22px;margin:0 0 14px}
.result[hidden],.who[hidden],.finish[hidden]{display:none}
.result h2{color:var(--heading);font-size:1.3rem;margin:0 0 4px}
.result .big{font-size:2rem;font-weight:800;color:var(--brand);margin:0}
.result ul{margin:6px 0 10px;padding-left:22px}
.result .sent{font-weight:700;margin:8px 0}
.result .sent.ok{color:var(--ok)}
.result .sent.bad{color:var(--no)}
.finish{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:0 0 14px}
.finish p{margin:0 0 10px}
.name-overlay{position:fixed;inset:0;z-index:50;background:rgba(28,25,23,.62);display:grid;place-items:center;padding:16px}
.name-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.name-box h2{color:var(--heading);font-size:1.25rem;margin:0 0 8px}
.name-box p{margin:0 0 10px;font-size:.93rem}
.name-box label{display:block;font-weight:700;margin:12px 0 4px}
.name-box input{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:8px 12px}
.name-error{color:var(--no);font-weight:700;min-height:1.4em;margin:6px 0 0}
.name-actions{display:flex;gap:10px;margin-top:6px}
@media (max-width:560px){.blk{padding:14px}.tab{padding:5px 11px}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <a class="brand" href="https://ieltsharper.github.io/portal/"><span class="brand-mark" aria-hidden="true">IH</span>IELTS Harper Portal</a>
  <a class="topbar-link" href="https://ieltsharper.github.io/portal/">&larr; Back to the portal</a>
</div></div>
<main class="wrap">
  <div class="hero">
    <p class="eyebrow">@@EYEBROW@@</p>
    <h1>@@H1@@</h1>
    <p class="sub">@@SUB@@</p>
  </div>
@@HERO_EXTRA@@
  <div class="tabs" role="tablist" aria-label="Sections">
@@TABS@@
  </div>
@@SECTIONS@@
@@AFTER@@
  <footer>
    <p><strong>Sources.</strong> @@SOURCES@@</p>
  </footer>
</main>
<script>
(function(){
var MODE = "@@MODE@@";
var KEY = "@@KEY@@";
var state;
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
state.v = state.v || {}; state.done = state.done || {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function norm(s){ return String(s == null ? "" : s).toLowerCase().replace(/[’']/g, "").replace(/[,.;:!]/g, " ").replace(/\s+/g, " ").trim(); }
function answers(el){ return JSON.parse(el.getAttribute("data-ans")); }
function isRight(el, v){ var n = norm(v); return n !== "" && answers(el).some(function(a){ return norm(a) === n; }); }
function show(el){ return answers(el)[0]; }

/* ---- restore + wire inputs ---- */
$$(".gap").forEach(function(el){
  var id = el.getAttribute("data-id");
  if (state.v[id] != null) el.value = state.v[id];
  el.addEventListener("input", function(){ state.v[id] = el.value; clearMark(el); save(); });
  el.addEventListener("change", function(){ state.v[id] = el.value; clearMark(el); save(); });
});
$$("textarea.free").forEach(function(el){
  var id = el.getAttribute("data-id");
  if (state.v[id] != null) el.value = state.v[id];
  el.addEventListener("input", function(){ state.v[id] = el.value; save(); });
});
$$(".opts[data-id]").forEach(function(g){
  var id = g.getAttribute("data-id");
  var locked = g.hasAttribute("data-locked");
  function paint(){
    $$(".opt", g).forEach(function(b){ b.setAttribute("aria-pressed", String(state.v[id] === b.getAttribute("data-v"))); });
  }
  if (locked) { state.v[id] = g.getAttribute("data-locked"); }
  paint();
  if (locked) return;
  $$(".opt", g).forEach(function(b){
    b.addEventListener("click", function(){
      if (g.hasAttribute("data-frozen")) return;
      state.v[id] = b.getAttribute("data-v"); paint(); clearMark(g); save();
    });
  });
});
function clearMark(el){
  if (el.classList) el.classList.remove("right", "wrong");
}

/* ---- checking ---- */
function items(blk){ return $$(".gap[data-ans], .opts[data-ans]", blk); }
function checkBlock(blk){
  var right = 0, list = items(blk), res = [];
  list.forEach(function(el){
    var id = el.getAttribute("data-id");
    var fix = el.parentNode.querySelector('.fix[data-for="' + id + '"]');
    if (el.classList.contains("opts")) {
      var v = state.v[id] || "", ok = isRight(el, v);
      el.setAttribute("data-frozen", "1");
      $$(".opt", el).forEach(function(b){
        b.classList.remove("right", "wrong", "answer");
        if (b.getAttribute("data-v") === v) b.classList.add(ok ? "right" : "wrong");
        if (!ok && norm(b.getAttribute("data-v")) === norm(show(el))) b.classList.add("answer");
      });
      if (ok) right++;
      res.push({id: id, ok: ok, given: v, right: show(el)});
      return;
    }
    var okv = isRight(el, el.value);
    clearMark(el); el.classList.add(okv ? "right" : "wrong");
    if (okv) right++;
    if (fix) fix.textContent = okv ? "" : "→ " + show(el);
    if (el.tagName === "INPUT") el.readOnly = true;
    if (el.tagName === "SELECT") el.disabled = true;
    res.push({id: id, ok: okv, given: el.value, right: show(el)});
  });
  var bs = $(".blk-score", blk);
  if (bs) bs.textContent = right + " / " + list.length;
  state.done[blk.getAttribute("data-blk")] = right + "/" + list.length;
  save(); refresh();
  return {right: right, total: list.length, res: res};
}
function resetBlock(blk){
  items(blk).forEach(function(el){
    var id = el.getAttribute("data-id");
    if (el.hasAttribute("data-locked")) return;
    delete state.v[id];
    if (el.classList.contains("opts")) {
      el.removeAttribute("data-frozen");
      $$(".opt", el).forEach(function(b){ b.classList.remove("right", "wrong", "answer"); b.setAttribute("aria-pressed", "false"); });
    } else {
      el.value = ""; clearMark(el); el.readOnly = false; el.disabled = false;
      var fix = el.parentNode.querySelector('.fix[data-for="' + id + '"]'); if (fix) fix.textContent = "";
    }
  });
  $(".blk-score", blk).textContent = "";
  delete state.done[blk.getAttribute("data-blk")];
  save(); refresh();
}
function refresh(){
  $$(".sec").forEach(function(sec){
    var blks = $$(".blk[data-checkable]", sec), n = 0, r = 0, t = 0;
    blks.forEach(function(b){
      var d = state.done[b.getAttribute("data-blk")];
      if (d) { n++; var p = d.split("/"); r += +p[0]; t += +p[1]; }
    });
    var tab = $('.tab[data-sec="' + sec.id + '"]');
    var all = blks.length > 0 && n === blks.length;
    if (tab) tab.classList.toggle("done", all);
    var sc = $(".sec-score", sec);
    if (sc) sc.textContent = n ? (MODE === "test" ? "Score " + r + " / " + t : "Checked " + n + " of " + blks.length + " exercises · Score " + r + " / " + t + " so far") : "";
  });
}
$$(".blk").forEach(function(blk){
  var b = blk.getAttribute("data-blk");
  var chk = $(".js-check", blk), rs = $(".js-reset", blk), sg = $(".js-sugg", blk);
  if (chk) chk.addEventListener("click", function(){
    var empty = items(blk).filter(function(el){ return el.classList.contains("opts") ? !state.v[el.getAttribute("data-id")] : !el.value; }).length;
    if (empty && !confirm(empty + " answer(s) are still empty. Check anyway?")) return;
    checkBlock(blk);
  });
  if (rs) rs.addEventListener("click", function(){ resetBlock(blk); });
  if (sg) sg.addEventListener("click", function(){
    var open = $$(".sugg", blk).some(function(s){ return s.hidden; });
    $$(".sugg", blk).forEach(function(s){ s.hidden = !open; });
    sg.textContent = open ? "Hide suggested answers" : "Show suggested answers";
    if (open) state.done[b] = "seen"; else delete state.done[b];
    save();
  });
  if (MODE !== "test" && state.done[b] && state.done[b] !== "seen" && chk) checkBlock(blk);
});

/* ---- tabs ---- */
function openSec(id){
  var found = false;
  $$(".sec").forEach(function(s){ var on = s.id === id; s.classList.toggle("on", on); if (on) found = true; });
  if (!found) { id = $(".sec").id; $(".sec").classList.add("on"); }
  $$(".tab").forEach(function(t){ t.setAttribute("aria-selected", String(t.getAttribute("data-sec") === id)); });
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}
$$(".tab").forEach(function(t){
  t.addEventListener("click", function(){ openSec(t.getAttribute("data-sec")); window.scrollTo({top: 0}); });
});
openSec((location.hash || "").slice(1) || (state.last || ""));
window.addEventListener("hashchange", function(){ openSec(location.hash.slice(1)); });
refresh();

/* ---- compulsory test: name, finish, send to the portal ---- */
if (MODE === "test") (function(){
  var TEST = "@@TESTID@@";
  var API_URL = "https://script.google.com/macros/s/AKfycbwKm1zvqca2-WO20f49M4mNW2qn9Aq4uxJZ3_bnQrErWPL5TN4jHycXZUQBDJ1W7wWg/exec";
  var PORTAL = "https://ieltsharper.github.io/portal/";
  var NAME_KEY = "ih-reading:name";
  function token(){ try { return localStorage.getItem("portal.session"); } catch (e) { return null; } }
  function storedName(){ try { return localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; } }
  function cleanName(s){ return String(s || "").normalize("NFC").replace(/\s+/g, " ").trim(); }
  function nameProblem(n){ return (n.length < 2 || n.length > 40 || !/\p{L}/u.test(n) || /[<>]/.test(n)) ? "Please type your name (2-40 letters)." : ""; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function clip(s, n){ s = String(s).replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  var who = $("#who"), panel = $("#result"), finishBox = $("#finish");
  var overlay = null, after = null;

  function setInert(on){ $$("nav.topbar, .topbar, main").forEach(function(el){ if (on) el.setAttribute("inert", ""); else el.removeAttribute("inert"); }); }
  function drawWho(){
    var n = token() ? "" : storedName();
    if (state.fin) { who.hidden = true; return; }
    who.hidden = false;
    who.innerHTML = token()
      ? "You are signed in to the portal. Your result will be sent to your teacher with your portal name."
      : "Your result will be sent to your teacher under the name <strong>" + esc(n) + "</strong> <button type=\"button\" class=\"link-btn\" id=\"change-name\">Change</button>";
    var cb = $("#change-name"); if (cb) cb.addEventListener("click", function(){ askName(true); });
  }
  function askName(change, problem){
    if (overlay) overlay.remove();
    overlay = document.createElement("div"); overlay.className = "name-overlay";
    overlay.innerHTML = "<form class=\"name-box\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"nm-title\" novalidate>" +
      "<h2 id=\"nm-title\">" + (change ? "Change your name" : "Before you start: what is your name?") + "</h2>" +
      "<p>This test is compulsory. When you finish, your score and your answers are sent to your teacher under this name.</p>" +
      "<p><strong>Please use only one name on this website</strong>, spelt the same way every time (for example, your full name), the same name as on the Reading and Listening pages.</p>" +
      "<label for=\"nm-input\">Your name</label><input id=\"nm-input\" type=\"text\" autocomplete=\"name\" maxlength=\"40\" spellcheck=\"false\">" +
      "<p class=\"name-error\" id=\"nm-error\" role=\"alert\"></p>" +
      "<div class=\"name-actions\"><button type=\"submit\" class=\"btn primary\">" + (change ? "Save name" : "Start the test") + "</button>" +
      (change ? "<button type=\"button\" class=\"btn\" id=\"nm-cancel\">Cancel</button>" : "") + "</div>" +
      "<p style=\"margin-top:12px\">Have an IELTS Harper Portal account? <a href=\"" + PORTAL + "\" target=\"_blank\" rel=\"noopener\">Sign in to the portal</a>, then reload this page.</p></form>";
    document.body.appendChild(overlay); setInert(true);
    var input = $("#nm-input"), error = $("#nm-error");
    if (change) input.value = storedName();
    if (problem) error.textContent = problem;
    input.focus();
    function close(){ overlay.remove(); overlay = null; setInert(false); }
    if (change) {
      $("#nm-cancel").addEventListener("click", close);
      overlay.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });
    }
    $("form", overlay).addEventListener("submit", function(e){
      e.preventDefault();
      var n = cleanName(input.value), bad = nameProblem(n);
      if (bad) { error.textContent = bad; input.focus(); return; }
      try { localStorage.setItem(NAME_KEY, n); } catch (err) {}
      close(); drawWho();
      if (after) { var f = after; after = null; f(); }
    });
  }

  function numOf(id){ return id.slice(id.lastIndexOf("-") + 1); }
  function mark(){
    var secs = [], wrong = [], written = [], right = 0, total = 0;
    $$(".sec").forEach(function(sec){
      var sr = 0, st = 0, title = $('.tab[data-sec="' + sec.id + '"]').textContent;
      $$(".blk", sec).forEach(function(blk){
        var head = clip(($("h3", blk) || {textContent: ""}).textContent.replace(/^\d+\.\s*/, ""), 45);
        if (blk.hasAttribute("data-checkable")) {
          var r = checkBlock(blk);
          sr += r.right; st += r.total;
          r.res.forEach(function(x){
            if (!x.ok) wrong.push(clip(title + " · " + head + " · Q" + numOf(x.id) + ": wrote “" + (x.given || "(blank)") + "” (right: “" + x.right + "”)", 390));
          });
        } else {
          $$("textarea.free", blk).forEach(function(ta){
            ta.readOnly = true;
            var v = ta.value.replace(/\s+/g, " ").trim();
            if (v) written.push(clip(title + " · " + head + " · sentence " + numOf(ta.getAttribute("data-id")) + ": " + v, 390));
          });
          $$(".sugg", blk).forEach(function(s){ s.hidden = false; });
        }
      });
      secs.push({title: title, correct: sr, total: st});
      right += sr; total += st;
    });
    return {correct: right, total: total, sections: secs, wrong: wrong.slice(0, 150), written: written.slice(0, 20)};
  }
  function drawResult(){
    var f = state.fin;
    finishBox.hidden = true; who.hidden = true; panel.hidden = false;
    $("#res-score").textContent = f.correct + " / " + f.total;
    $("#res-secs").innerHTML = f.sections.map(function(s){ return "<li>" + esc(s.title) + ": <strong>" + s.correct + " / " + s.total + "</strong></li>"; }).join("");
    var sent = $("#res-sent"), retry = $("#res-retry");
    if (f.sent) { sent.className = "sent ok"; sent.textContent = "✓ Your result has been sent to your teacher" + (f.who ? " under the name " + f.who : "") + "."; retry.hidden = true; }
    else if (f.sending) { sent.className = "sent"; sent.textContent = "Sending your result to your teacher…"; retry.hidden = true; }
    else { sent.className = "sent bad"; sent.textContent = f.err ? "Your result has NOT reached your teacher yet: " + f.err : "Your result has NOT reached your teacher yet."; retry.hidden = false; }
  }
  function send(){
    var f = state.fin, tok = token(), name = storedName();
    if (!tok && !name) { after = send; askName(false); return; }
    var payload = {test: TEST, correct: f.correct, total: f.total, sections: f.sections, wrong: f.wrong, written: f.written};
    if (name) payload.name = name;
    f.sending = true; f.err = ""; drawResult();
    fetch(API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, redirect: "follow", credentials: "omit",
      body: JSON.stringify({action: "pagetest.result", token: tok, payload: payload})})
      .then(function(r){ return r.json(); })
      .then(function(env){
        f.sending = false;
        if (env.ok) { f.sent = true; f.who = env.data.name; f.err = ""; }
        else if (env.error.code === "invalid" && /name/i.test(env.error.message)) {
          try { localStorage.removeItem(NAME_KEY); } catch (e) {}
          f.err = env.error.message; save(); drawResult(); after = send; askName(false, env.error.message); return;
        } else f.err = env.error.message;
        save(); drawResult();
      })
      .catch(function(){ f.sending = false; f.err = "no connection. Check your internet and press Send again."; save(); drawResult(); });
  }

  $("#finish-btn").addEventListener("click", function(){
    var empty = items(document).filter(function(el){ return el.closest(".blk[data-checkable]") && (el.classList.contains("opts") ? !state.v[el.getAttribute("data-id")] : !el.value); }).length;
    var msg = (empty ? empty + " answer(s) are still empty. " : "") + "When you finish, your answers are marked and sent to your teacher, and you cannot change them. Finish now?";
    if (!confirm(msg)) return;
    var m = mark();
    state.fin = {correct: m.correct, total: m.total, sections: m.sections, wrong: m.wrong, written: m.written, sent: false, sending: false, err: ""};
    save(); drawResult(); send(); window.scrollTo({top: 0});
  });
  $("#res-retry").addEventListener("click", send);
  $("#res-again").addEventListener("click", function(){
    if (!confirm("Start the test again? Your answers will be cleared. When you finish again, the new result is sent to your teacher too.")) return;
    state.v = {}; state.done = {}; delete state.fin; save(); location.reload();
  });

  if (state.fin) {
    mark();
    drawResult();
    if (!state.fin.sent && !state.fin.sending) send();
    else if (state.fin.sending) { state.fin.sending = false; save(); drawResult(); }
  } else {
    drawWho();
    if (!token() && !storedName()) askName(false);
  }
})();
})();
</script>
</body>
</html>
